name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v6

      - name: آماده‌سازی فایل‌های سایت
        run: |
          rm -rf site
          mkdir site
          unzip -q hamyar-site-v1.1.zip -d site
          test -f site/index.html

      - name: تنظیم GitHub Pages
        uses: actions/configure-pages@v5

      - name: بارگذاری فایل‌های سایت
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: انتشار سایت
        id: deployment
        uses: actions/deploy-pages@v4
